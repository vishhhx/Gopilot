<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/blossom.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1816" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="GoPilot is one chat for Gmail, Calendar, Drive, Sheets, Meet and Forms, with an agent for each app and a visual workflow builder."
    />
    <title>GoPilot</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong ground.
      (function () {
        try {
          var t = localStorage.getItem("theam") || "system";
          var dark =
            t === "dark" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
