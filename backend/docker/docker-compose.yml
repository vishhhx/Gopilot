version: "3.8"

services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-pliotx
    ports:
      - "6380:6379"
      - "8002:8001"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: mongo-pilotx
    ports:
      - "27018:27017"
    volumes:
      - pilotx-mongo-data:/data/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: qdrant-pilotx
    ports:
      - "6333:6333" 
      - "6334:6334" 
    volumes:
      - pilotx-qdrant-data:/qdrant/storage
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"    
      - "15672:15672"   
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbitpassword
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    restart: unless-stopped

volumes:
  redis-data:
  pilotx-mongo-data:
  pilotx-qdrant-data:
  rabbitmq-data:
  rabbitmq-logs:
